# Cloud profile (Fly, behind the BFF). No secret has a default: MONGODB_URI, KYBR_BFF_KEY_CURRENT,
# KYBR_HASH_SECRET, KYBR_IDEMPOTENCY_ENC_KEY, KYBR_PII_ENC_KEY, KYBR_ADMIN_TOKEN and (live provider)
# KYBR_CNPJA_API_KEY must come from Fly secrets, as must the scanner's TLS material, the storage
# settings and KYBR_RESEND_API_KEY. ProfileGuards refuses every non-production mode.

logging:
  structured:
    format:
      console: ecs
  level:
    org.springframework.web: INFO
    org.apache.catalina: INFO

kybr:
  client-ip:
    platform-header: ${KYBR_CLIENT_IP_PLATFORM_HEADER:Fly-Client-IP}
  cnpja:
    mode: ${KYBR_CNPJA_MODE:live}
    monthly-credits: ${KYBR_CNPJA_MONTHLY_CREDITS:} # the owner's plan value; startup fails without it when live
  scanner:
    mode: ${KYBR_SCANNER_MODE:clamd}
  storage:
    mode: ${KYBR_STORAGE_MODE:s3}
  email:
    mode: ${KYBR_EMAIL_MODE:resend}
