# Base configuration, shared by every profile.
# Secrets have no defaults here: staging and prod read them from the environment (Fly secrets),
# and KybrProperties stops startup when one is missing or malformed. Only the local, docker and
# test profiles add non-secret dev placeholders.

server:
  port: ${PORT:8080}
  forward-headers-strategy: none # X-Forwarded-* is never trusted; KybrProperties.ClientIp decides
  max-http-request-header-size: 16KB
  servlet:
    session:
      tracking-modes: [] # no session cookie, no URL rewriting
  error:
    whitelabel:
      enabled: false
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-path: never
    include-exception: false
  tomcat:
    accesslog:
      enabled: false # AccessLogFilter writes the only access log
    max-part-count: 32 # document upload: 30 files + the tipo field + margin
    max-part-header-size: 8KB # a 255-character UTF-8 file name sent as both filename and filename*

spring:
  application:
    name: kybr
  threads:
    virtual:
      enabled: true # request handling runs on virtual threads
  mongodb:
    uri: ${MONGODB_URI}
  data:
    mongodb:
      auto-index-creation: false # IndexBootstrap creates indexes
  web:
    resources:
      add-mappings: false # no static resources, so no directory redirects
  servlet:
    multipart:
      # Only the seller document upload accepts multipart (BodySizeLimitFilter refuses it elsewhere).
      # Parts are parsed only when the handler asks, after every check that needs no body.
      enabled: true
      resolve-lazily: true
      file-size-threshold: 0 # every part goes to disk, never to memory
      max-file-size: 10MB # 10 MiB
      max-request-size: 10747904B # 10 MiB of files + 256 KiB of multipart overhead: the document upload body cap
      location: ${kybr.upload.temp-dir}
  mvc:
    log-request-details: false

management:
  server:
    port: ${MANAGEMENT_PORT:8081} # internal only, never published
  endpoints:
    web:
      exposure:
        include: health,prometheus,admin # admin: operator operations, behind the admin token
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
          additional-path: "server:/livez" # the only probe on the main port; readiness stays on 8081
        readiness:
          include: readinessState,mongo # 8081 only

springdoc:
  api-docs:
    enabled: false # enabled in local and test only
  # The contract of record documents production controllers only, never test probes.
  packages-to-scan: com.matheusmelo.kybr.controller

kybr:
  bff:
    current: ${KYBR_BFF_KEY_CURRENT:}
    previous: ${KYBR_BFF_KEY_PREVIOUS:}
    # Deny by default: the key is required everywhere except these (method, pattern)
    # pairs, matched exactly on the normalised path. A new exemption is a deliberate design decision.
    exemptions:
      - method: GET
        pattern: /livez
      - method: POST
        pattern: "/public/v/{slug}/cases/{token}/documents" # seller document upload: browser to API, no key
      - method: OPTIONS
        pattern: "/public/v/{slug}/cases/{token}/documents"
  client-ip:
    platform-header: ${KYBR_CLIENT_IP_PLATFORM_HEADER:}
    # Routes where the BFF legitimately sends no client IP (a cached read, the probe, the
    # browser-direct upload): a missing client IP there is expected, not an alert.
    not-expected:
      - method: GET
        pattern: "/public/v/{slug}"
      - method: GET
        pattern: /livez
      - method: POST
        pattern: "/public/v/{slug}/cases/{token}/documents"
      - method: OPTIONS
        pattern: "/public/v/{slug}/cases/{token}/documents"
  hashing:
    secret: ${KYBR_HASH_SECRET:}
    previous: ${KYBR_HASH_SECRET_PREVIOUS:}
  idempotency:
    enc-key: ${KYBR_IDEMPOTENCY_ENC_KEY:}
  limits:
    default-max-body: 1MB # 1 MiB
    # Routes that accept only multipart/form-data (anything else is 415 before the body is read),
    # each with its own cap (no route is ever uncapped).
    multipart:
      - method: POST
        pattern: "/public/v/{slug}/cases/{token}/documents"
        max-body: ${spring.servlet.multipart.max-request-size} # one tipo per request, at most 30 files
  logging:
    token-prefixes:
      - cases # the next path segment is a case token, redacted in logs
  # Company-data provider. stub replays synthetic fixtures; live calls the provider (prod).
  cnpja:
    mode: ${KYBR_CNPJA_MODE:stub}
    api-key: ${KYBR_CNPJA_API_KEY:} # required when live; header only, never in a URL or a log
    base-url: https://api.cnpja.com
    timeouts:
      connect: 2s
      lookup-read: 3s # company lookup, while the seller waits
      worker-read: 8s # background verification
    max-age-days: 45 # oldest provider-side cached record accepted
    strategy: CACHE_IF_FRESH
    credit-costs:
      base: 1
      simples: 1
      ie: 1
    rate-per-minute: ${KYBR_CNPJA_RATE_PER_MINUTE:60} # placeholder sized above a burst of verifications; the owner supplies the plan's real limit
    monthly-credits: ${KYBR_CNPJA_MONTHLY_CREDITS:10000} # the plan's credits; no default in prod
    auth-header: Authorization # carries the API key; the key itself is an environment-only secret
    addons: # what a verification's full check asks for beyond the base record
      simples: true # Simples/MEI regime
      registrations: BR # state registrations: BR (every state) or a list such as SP,RJ
  link:
    # Request limits: limit per fixed window. The -unknown variants count per link when the client
    # IP is unknown (a shared subject).
    limits:
      lookup-ip: { limit: 5, window: 1m }
      lookup-ip-daily: { limit: 30, window: 1d }
      lookup-ip-unknown: { limit: 120, window: 1m }
      verify-ip: { limit: 10, window: 10m } # per (IP, link)
      verify-ip-unknown: { limit: 300, window: 10m }
      verify-cnpj: { limit: 3, window: 1h } # per (link, CNPJ)
      case-ip: { limit: 300, window: 1m } # one polling tab is 30/min; room for shared IPs
      case-ip-unknown: { limit: 1200, window: 1m }
      contact-ip: { limit: 20, window: 1h }
      contact-ip-unknown: { limit: 200, window: 1h }
      contact-case: { limit: 5, window: 1d } # address changes per case
    # Provider credit budgets: each one degrades (lookups cache-only, verifications deferred to
    # manual review), none fails a request. Daily global budgets derive from monthly-credits.
    budgets:
      d2-share: 0.20 # share of monthly credits company lookups may spend
      burst: 2.0 # a busy day may spend this many times the even daily rate
      lookup-per-slug-daily: 50
      verify-per-slug-daily: 30
      no-data-per-slug-daily: 20
      cache-reads-per-slug-alert: 500 # alert only
    review-deadline: 2d
    regularizacao:
      receita-url: https://www.gov.br/receitafederal/pt-br/assuntos/orientacao-tributaria/cadastros/cnpj
  cache:
    positive-ttl: 30d
    negative-ttl: 1d
  verification:
    workers: 4
    queue: 100
    max-attempts: 3
    backoff: [5s, 30s, 2m]
    lease: 60s
    poll-interval: 5s
    poller-enabled: true # off only in tests; prod refuses to start with it off
  runtime-flags:
    cache-ttl: 10s # kill switches take effect within this time
  pii:
    enc-key: ${KYBR_PII_ENC_KEY:}
  admin:
    token: ${KYBR_ADMIN_TOKEN:}
    token-previous: ${KYBR_ADMIN_TOKEN_PREVIOUS:}
    max-body: 16KB
    allow-explicit-slug: false # true outside prod only; prod refuses to start with it on
  metrics:
    max-slug-tags: 500
  # Seller document upload.
  upload:
    max-bytes-per-tipo: 10MB # 10 MiB of original file bytes per document type, across calls
    max-files-per-case: 30
    concurrency: 2 # uploads per machine past the cheap checks
    reencode-concurrency: 2
    temp-dir: ${KYBR_UPLOAD_TEMP_DIR:${java.io.tmpdir}/kybr-uploads} # dedicated and size-bounded; wiped at startup
    limits:
      ip: { limit: 120, window: 10m } # per socket IP
      ip-unknown: { limit: 300, window: 10m } # per link, when the IP is unknown
      case: { limit: 60, window: 1d }
  # Photos are decoded only by the sanitizer service in the isolated scanner organisation.
  image:
    mode: ${KYBR_IMAGE_MODE:remote} # the sanitizer service; prod refuses anything else
    max-pixels: 50000000
    max-side: 12000
    target-long-edge: 4000
  sanitizer:
    host: ${KYBR_SANITIZER_HOST:} # required in prod
    port: ${KYBR_SANITIZER_PORT:} # required in prod
    timeout: 20s
    max-response: 12MB
  # Malware scanner. stub flags test signatures only; clamd is the isolated scanner over mutual TLS (prod).
  scanner:
    mode: ${KYBR_SCANNER_MODE:stub}
    host: ${KYBR_SCANNER_HOST:}
    port: ${KYBR_SCANNER_PORT:3310}
    connect-timeout: 3s
    read-timeout: 20s
    max-signature-age: 48h # older signatures: the scan session's files wait and an alert fires
    spki-sha256: ${KYBR_SCANNER_SPKI_SHA256:} # pin of the scanner certificate's public key
    client-cert: ${KYBR_SCANNER_CLIENT_CERT:}
    client-key: ${KYBR_SCANNER_CLIENT_KEY:}
    ca: ${KYBR_SCANNER_CA:}
  # The asynchronous scan job: quarantine -> scan (+ photo re-encode) -> accepted or refused.
  scan:
    enabled: ${KYBR_SCAN_ENABLED:true} # tests run it on demand; prod refuses false
    workers: 2
    poll-interval: 10s
    wake-timeout: 120s # a stopped scanner machine starts on the first connection
    wake-interval: 5s
    lease: 5m
    max-attempts: 6
    backoff: 1m,5m,15m,1h,3h
    stuck-after: 24h
  # Document storage. memory keeps objects in the process; s3 is the private, KMS-encrypted bucket (prod).
  storage:
    mode: ${KYBR_STORAGE_MODE:memory}
    bucket: ${KYBR_STORAGE_BUCKET:}
    region: sa-east-1
    kms-key-id: ${KYBR_STORAGE_KMS_KEY_ID:}
    quarantine-bucket: ${KYBR_STORAGE_QUARANTINE_BUCKET:} # received files until scanned; its own bucket
    quarantine-kms-key-id: ${KYBR_STORAGE_QUARANTINE_KMS_KEY_ID:} # and its own key
    role-arn: ${KYBR_AWS_ROLE_ARN:} # assumed with the platform's identity token
    oidc-audience: sts.amazonaws.com
    access-key-id: ${KYBR_AWS_ACCESS_KEY_ID:} # static-key fallback only
    secret-access-key: ${KYBR_AWS_SECRET_ACCESS_KEY:}
    connect-timeout: 3s
    call-timeout: 30s
  # Transactional e-mail. recording keeps messages in memory; resend sends (prod).
  email:
    mode: ${KYBR_EMAIL_MODE:recording}
    api-key: ${KYBR_RESEND_API_KEY:} # header only, never in a URL or a log
    base-url: https://api.resend.com
    from: "Kybr <nao-responda@kybr.com.br>"
    dns-verified: ${KYBR_EMAIL_DNS_VERIFIED:false} # nothing is sent until the domain's DNS records are published
    test-recipients: ${KYBR_EMAIL_TEST_RECIPIENTS:} # comma-separated; the operator test e-mail goes nowhere else
    connect-timeout: 3s
    read-timeout: 10s
    caps:
      per-hour: 3 # per address; more are dropped
      per-day: 10
    events:
      contato-alterado:
        enabled: ${KYBR_EMAIL_CONTATO_ALTERADO_ENABLED:false} # off until the notice has its copy
    dispatcher:
      enabled: true # off only in tests; prod refuses to start with it off
      interval: 10s
      lease: 60s
      backoff: [1m, 10m, 1h]
  retention:
    enabled: true # off only in tests; prod refuses to start with it off
    backstop: P12M # a never-decided case's documents go this long after the seller's last activity
    interval: 1h
    backstop-interval: 1d
    orphan-interval: 7d
    orphan-min-age: 24h
    lease: 5m
  cors:
    d6: # the seller document upload, called from the browser
      origins: [https://kybr.com.br]
      origin-patterns: []
