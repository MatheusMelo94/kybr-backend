openapi: 3.1.0
info:
  title: Kybr API
  description: |-
    The seller link lives under the unversioned base path `/public/v/{slug}`. A breaking change would ship as `/public/v2/{slug}/...` next to it, never in place.

    Every call comes from the link's server with `X-Kybr-BFF-Key`; calls that are rate-limited or audited also carry `X-Kybr-Client-IP`. The one exception is the document upload (`POST /public/v/{slug}/cases/{token}/documents`), which the seller's browser calls directly, without either header. Errors use the `ErrorResponse` envelope: branch on `code`, never on `message`. Every response carries `X-Request-Id`, and every 429 carries `Retry-After` in seconds. Timestamps are ISO 8601 with an offset. CNPJs are 14 upper-case characters without punctuation, numeric or alphanumeric.
  version: 0.4.0
servers:
- url: https://api.kybr.com.br
- url: https://api-staging.kybr.com.br
tags:
- name: Seller link
  description: "The public seller link: link info, company lookup, verification start,\
    \ case read and the seller's contact e-mail. Called server to server by the link's\
    \ frontend."
- name: Seller documents
  description: "The seller's document upload, called from the browser."
paths:
  /public/v/{slug}/cases/{token}/contact:
    put:
      tags:
      - Seller link
      summary: Save the seller's contact e-mail
      description: "Stores the address for messages about this case only; the case\
        \ read then shows it masked. Sending the current address again changes nothing.\
        \ Checks run in this order: slug, client limit, case, address, decided case,\
        \ then the per-case change limit."
      operationId: changeContact
      parameters:
      - $ref: "#/components/parameters/X-Kybr-BFF-Key"
      - $ref: "#/components/parameters/X-Kybr-Client-IP"
      - name: slug
        in: path
        description: "The link's slug: 1 to 64 characters of `[a-z0-9-]`, starting\
          \ and ending with a letter or digit. Anything else is 404 `LINK_NAO_ENCONTRADO`."
        required: true
        schema:
          type: string
          pattern: "^[a-z0-9](?:[a-z0-9-]{0,62}[a-z0-9])?$"
      - name: token
        in: path
        description: "The case token returned when the verification started. Anything\
          \ that doesn't match `^[A-Za-z0-9_-]{22,64}$` is 404 `CASO_NAO_ENCONTRADO`."
        required: true
        schema:
          type: string
          pattern: "^[A-Za-z0-9_-]{22,64}$"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactRequest"
        required: true
      responses:
        "204":
          description: Saved (or unchanged).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
        "400":
          description: "- `REQUISICAO_INVALIDA`: malformed JSON (including duplicate\
            \ keys or trailing content), a missing body, or a path that isn't normalised."
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                REQUISICAO_INVALIDA:
                  value:
                    code: REQUISICAO_INVALIDA
                    message: Malformed request.
        "403":
          description: "- `BFF_KEY_AUSENTE`: `X-Kybr-BFF-Key` is missing or wrong\
            \ (the same body either way)."
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                BFF_KEY_AUSENTE:
                  value:
                    code: BFF_KEY_AUSENTE
                    message: Forbidden.
        "404":
          description: |-
            - `LINK_NAO_ENCONTRADO`: the slug is unknown or malformed, the link isn't set up yet, or it is disabled. Decided from the slug alone, before anything else in the request is read.
            - `CASO_NAO_ENCONTRADO`: the token is unknown or belongs to another link (the same response either way).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                LINK_NAO_ENCONTRADO:
                  value:
                    code: LINK_NAO_ENCONTRADO
                    message: Link not found.
                CASO_NAO_ENCONTRADO:
                  value:
                    code: CASO_NAO_ENCONTRADO
                    message: Case not found.
        "409":
          description: "- `CASO_DECIDIDO`: the case is already approved or blocked."
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                CASO_DECIDIDO:
                  value:
                    code: CASO_DECIDIDO
                    message: Case already decided.
        "413":
          description: "- `REQUISICAO_GRANDE`: the body is over 1 MiB."
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                REQUISICAO_GRANDE:
                  value:
                    code: REQUISICAO_GRANDE
                    message: Request too large.
        "415":
          description: "- `MIDIA_NAO_SUPORTADA`: the body isn't `application/json`."
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                MIDIA_NAO_SUPORTADA:
                  value:
                    code: MIDIA_NAO_SUPORTADA
                    message: Unsupported media type.
        "422":
          description: |-
            - `EMAIL_INVALIDO` (`field: email`): missing, not a string, over 254 characters, with control or format characters, or not a plain address.
            - `VALOR_INVALIDO`: an unknown property.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                EMAIL_INVALIDO:
                  value:
                    code: EMAIL_INVALIDO
                    message: Invalid e-mail address.
                VALOR_INVALIDO:
                  value:
                    code: VALOR_INVALIDO
                    message: Invalid value.
        "429":
          description: "- `LIMITE_TENTATIVAS`: too many requests from this client,\
            \ or too many address changes on this case today."
          headers:
            Retry-After:
              description: Seconds to wait before retrying (digits only).
              schema:
                type: integer
                format: int32
                minimum: 1
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                LIMITE_TENTATIVAS:
                  value:
                    code: LIMITE_TENTATIVAS
                    message: Too many attempts.
        "500":
          description: "- `ERRO_INTERNO`: an unexpected error. No detail is given."
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                ERRO_INTERNO:
                  value:
                    code: ERRO_INTERNO
                    message: Internal error.
        "503":
          description: "- `INDISPONIVEL`: the database is unavailable. Retry later."
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                INDISPONIVEL:
                  value:
                    code: INDISPONIVEL
                    message: Service unavailable.
        default:
          description: Error envelope
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /public/v/{slug}/verify:
    post:
      tags:
      - Seller link
      summary: Start a verification
      description: "Creates a case for the company and starts verifying it; read the\
        \ result with the returned token. A valid CNPJ the data source doesn't know\
        \ is still accepted and goes to human review. `ref` and `ext_id` are stored\
        \ untouched and never echoed. When several fields are invalid, the first in\
        \ `cnpj`, `responsavel`, `ref`, `ext_id` order is reported."
      operationId: verify
      parameters:
      - $ref: "#/components/parameters/X-Kybr-BFF-Key"
      - $ref: "#/components/parameters/X-Kybr-Client-IP"
      - name: slug
        in: path
        description: "The link's slug: 1 to 64 characters of `[a-z0-9-]`, starting\
          \ and ending with a letter or digit. Anything else is 404 `LINK_NAO_ENCONTRADO`."
        required: true
        schema:
          type: string
          pattern: "^[a-z0-9](?:[a-z0-9-]{0,62}[a-z0-9])?$"
      - name: Idempotency-Key
        in: header
        description: "A UUID made fresh for each attempt and reused only to retry\
          \ after an unknown outcome. For 10 minutes, the same key with the same body\
          \ on the same slug replays the first response without creating another case\
          \ or counting against a limit; the same key with a different body is 422.\
          \ Any 2xx, and any 4xx other than 401, 408 and 429, is replayed (a 404 included);\
          \ 401, 408, 429 and 5xx are never stored, so the same key runs again."
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyRequest"
        required: true
      responses:
        "201":
          description: The case was created.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyResponse"
        "400":
          description: "- `REQUISICAO_INVALIDA`: malformed JSON (including duplicate\
            \ keys or trailing content), a missing body, or a path that isn't normalised."
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                REQUISICAO_INVALIDA:
                  value:
                    code: REQUISICAO_INVALIDA
                    message: Malformed request.
        "403":
          description: "- `BFF_KEY_AUSENTE`: `X-Kybr-BFF-Key` is missing or wrong\
            \ (the same body either way)."
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                BFF_KEY_AUSENTE:
                  value:
                    code: BFF_KEY_AUSENTE
                    message: Forbidden.
        "404":
          description: "- `LINK_NAO_ENCONTRADO`: the slug is unknown or malformed,\
            \ the link isn't set up yet, or it is disabled. Decided from the slug\
            \ alone, before anything else in the request is read."
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                LINK_NAO_ENCONTRADO:
                  value:
                    code: LINK_NAO_ENCONTRADO
                    message: Link not found.
        "406":
          description: "- `FORMATO_NAO_ACEITO`: `Accept` excludes `application/json`\
            \ (the body is still the JSON envelope)."
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                FORMATO_NAO_ACEITO:
                  value:
                    code: FORMATO_NAO_ACEITO
                    message: Response format not acceptable.
        "413":
          description: "- `REQUISICAO_GRANDE`: the body is over 1 MiB."
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                REQUISICAO_GRANDE:
                  value:
                    code: REQUISICAO_GRANDE
                    message: Request too large.
        "415":
          description: "- `MIDIA_NAO_SUPORTADA`: the body isn't `application/json`."
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                MIDIA_NAO_SUPORTADA:
                  value:
                    code: MIDIA_NAO_SUPORTADA
                    message: Unsupported media type.
        "422":
          description: |-
            - `CNPJ_INVALIDO` (`field: cnpj`): missing, not a string, not canonical, or a wrong check digit. 422 here; 400 on the lookup, where the CNPJ is a query parameter.
            - `RESPONSAVEL_INVALIDO` (`field: responsavel`): missing, not a string, fewer than two words, over 120 characters, or characters other than letters, space, `'`, `-` and `.`.
            - `VALOR_INVALIDO`: `ref` or `ext_id` over 256 characters or not printable ASCII (`field` names it); an unknown property; or an `Idempotency-Key` that is missing, not a UUID, the nil or max UUID, or reused with a different body (`field: Idempotency-Key`).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                CNPJ_INVALIDO:
                  value:
                    code: CNPJ_INVALIDO
                    message: Invalid CNPJ.
                RESPONSAVEL_INVALIDO:
                  value:
                    code: RESPONSAVEL_INVALIDO
                    message: Invalid responsible person.
                VALOR_INVALIDO:
                  value:
                    code: VALOR_INVALIDO
                    message: Invalid value.
        "429":
          description: |-
            - `LIMITE_CNPJ`: the same CNPJ was submitted too often on this link.
            - `LIMITE_TENTATIVAS`: too many verifications from this client on this link.
          headers:
            Retry-After:
              description: Seconds to wait before retrying (digits only).
              schema:
                type: integer
                format: int32
                minimum: 1
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                LIMITE_CNPJ:
                  value:
                    code: LIMITE_CNPJ
                    message: Too many attempts for this CNPJ.
                LIMITE_TENTATIVAS:
                  value:
                    code: LIMITE_TENTATIVAS
                    message: Too many attempts.
        "500":
          description: "- `ERRO_INTERNO`: an unexpected error. No detail is given."
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                ERRO_INTERNO:
                  value:
                    code: ERRO_INTERNO
                    message: Internal error.
        "503":
          description: "- `INDISPONIVEL`: the database is unavailable, or a request\
            \ with the same `Idempotency-Key` is still running (then `Retry-After:\
            \ 1`; retry with the same key)."
          headers:
            Retry-After:
              description: "Seconds to wait before retrying with the same key, when\
                \ the same key is still running."
              style: simple
              schema:
                type: integer
                minimum: 1
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                INDISPONIVEL:
                  value:
                    code: INDISPONIVEL
                    message: Service unavailable.
        default:
          description: Error envelope
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /public/v/{slug}/cases/{token}/documents:
    post:
      tags:
      - Seller documents
      summary: Upload documents
      description: |-
        Called from the seller's browser, not the link's server: no `X-Kybr-BFF-Key`, no `X-Kybr-Client-IP` and no credentials (send it with `credentials: "omit"`). The case token in the path is the only capability. CORS is answered for the product's origin (`https://kybr.com.br`; staging also allows its configured preview origins), exposing `Retry-After` and `X-Request-Id`, never with credentials. `Origin` is not a control: a request from any other origin, or with none, is processed the same way, and only the browser is kept from reading the answer.

        The body is `multipart/form-data`: one `tipo` and one or more `arquivos`. Files are typed by their first bytes only (`%PDF-`, `FF D8 FF`, the PNG signature); the declared content type and the file name are ignored, and the file name is never stored or echoed. A request sends exactly one PDF, or one or more JPEG/PNG photos (pages of one document). A PDF can't be added to a type that already has files, and photos can't be added to a type that holds a PDF. A type holds at most 10,485,760 bytes of files as sent, across calls, and a case at most 30 files across types. A file already received for the type and not refused (the same bytes) is ignored, so a retry after a lost answer adds nothing and answers the type's current state; files still being checked count toward both limits. A file identical to one refused as not allowed is refused at once (415).

        The answer is 202: files are received into a private quarantine and checked in the background. Every file is scanned; photos are then re-encoded without metadata (EXIF and GPS included) and downscaled to a 4,000 px long edge. PDFs are stored as sent. The case read (D4) shows each document item's `situacao_envio` (`verificando`, then `aceito` or `recusado` with `motivo_recusa`: `CONTEUDO_NAO_PERMITIDO`, `ARQUIVO_INVALIDO` or `VERIFICACAO_FALHOU`); poll it while any item is `verificando`. CMYK, YCCK, 12-bit and arithmetic-coded JPEGs, and photos over 50 megapixels or 12,000 px a side, are refused at once (415): send these as PDF.

        Checks run in this order: client limits, link, token, decided case, capacity, case limit, then the body. A refused request's body is never parsed.
      operationId: upload
      parameters:
      - name: slug
        in: path
        description: "The link's slug: 1 to 64 characters of `[a-z0-9-]`, starting\
          \ and ending with a letter or digit. Anything else is 404 `LINK_NAO_ENCONTRADO`."
        required: true
        schema:
          type: string
          pattern: "^[a-z0-9](?:[a-z0-9-]{0,62}[a-z0-9])?$"
      - name: token
        in: path
        description: "The case token returned when the verification started. Anything\
          \ that doesn't match `^[A-Za-z0-9_-]{22,64}$` is 404 `CASO_NAO_ENCONTRADO`."
        required: true
        schema:
          type: string
          pattern: "^[A-Za-z0-9_-]{22,64}$"
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/UploadForm"
        required: true
      responses:
        "202":
          description: "The files were received (now or by an earlier call) and are\
            \ being checked: the type, how many of its files count, and `situacao_envio`.\
            \ Poll the case read (D4) until the type's item is no longer `verificando`."
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResponse"
        "400":
          description: "- `REQUISICAO_INVALIDA`: a path that isn't normalised."
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                REQUISICAO_INVALIDA:
                  value:
                    code: REQUISICAO_INVALIDA
                    message: Malformed request.
        "404":
          description: |-
            - `LINK_NAO_ENCONTRADO`: the slug is unknown or malformed, the link isn't set up yet, or it is disabled. Decided from the slug, before the token or the body is read.
            - `CASO_NAO_ENCONTRADO`: the token is unknown, belongs to another link, or no longer opens the case (its documents were deleted); the same response either way.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                LINK_NAO_ENCONTRADO:
                  value:
                    code: LINK_NAO_ENCONTRADO
                    message: Link not found.
                CASO_NAO_ENCONTRADO:
                  value:
                    code: CASO_NAO_ENCONTRADO
                    message: Case not found.
        "406":
          description: "- `FORMATO_NAO_ACEITO`: `Accept` excludes `application/json`\
            \ (the body is still the JSON envelope)."
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                FORMATO_NAO_ACEITO:
                  value:
                    code: FORMATO_NAO_ACEITO
                    message: Response format not acceptable.
        "409":
          description: "- `CASO_DECIDIDO`: the case was approved or blocked; it takes\
            \ no more documents."
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                CASO_DECIDIDO:
                  value:
                    code: CASO_DECIDIDO
                    message: Case already decided.
        "413":
          description: |-
            - `ARQUIVO_GRANDE`: the type would hold more than 10,485,760 bytes of files as sent, across calls.
            - `LIMITE_ARQUIVOS`: the case would hold more than 30 files.
            - `REQUISICAO_GRANDE`: the body is over 10,747,904 bytes (10 MiB of files plus 256 KiB of multipart overhead), has more than 32 parts, a part header over 8 KiB, or a file over 10 MiB.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                ARQUIVO_GRANDE:
                  value:
                    code: ARQUIVO_GRANDE
                    message: File too large.
                LIMITE_ARQUIVOS:
                  value:
                    code: LIMITE_ARQUIVOS
                    message: Too many files.
                REQUISICAO_GRANDE:
                  value:
                    code: REQUISICAO_GRANDE
                    message: Request too large.
        "415":
          description: |-
            - `FORMATO_INVALIDO`: `tipo` is missing, unknown or not asked for on this case; no file; a file that isn't a PDF, JPEG or PNG by its first bytes; more than one PDF, or a PDF with photos; a PDF added to a type that has files, or photos added to a type that holds a PDF; a photo that can't be processed (see above); or a file identical to one refused as not allowed.
            - `MIDIA_NAO_SUPORTADA`: the body isn't `multipart/form-data`.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                FORMATO_INVALIDO:
                  value:
                    code: FORMATO_INVALIDO
                    message: File format not accepted.
                MIDIA_NAO_SUPORTADA:
                  value:
                    code: MIDIA_NAO_SUPORTADA
                    message: Unsupported media type.
        "429":
          description: "- `LIMITE_TENTATIVAS`: too many uploads from this address\
            \ (120 per 10 minutes) or for this case (60 per day)."
          headers:
            Retry-After:
              description: Seconds to wait before retrying (digits only).
              schema:
                type: integer
                format: int32
                minimum: 1
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                LIMITE_TENTATIVAS:
                  value:
                    code: LIMITE_TENTATIVAS
                    message: Too many attempts.
        "500":
          description: "- `ERRO_INTERNO`: an unexpected error. No detail is given."
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                ERRO_INTERNO:
                  value:
                    code: ERRO_INTERNO
                    message: Internal error.
        "503":
          description: "- `INDISPONIVEL`: storage is unavailable or this server is\
            \ busy; nothing was kept. Send the same files again after `Retry-After`\
            \ seconds."
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                INDISPONIVEL:
                  value:
                    code: INDISPONIVEL
                    message: Service unavailable.
        default:
          description: Error envelope
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /public/v/{slug}:
    get:
      tags:
      - Seller link
      summary: Link info
      description: "The workspace's name and how the seller reaches it. Not cached\
        \ on the server, so a change is visible on the next call. The frontend caches\
        \ it per slug and sends no client IP."
      operationId: info
      parameters:
      - $ref: "#/components/parameters/X-Kybr-BFF-Key"
      - name: slug
        in: path
        description: "The link's slug: 1 to 64 characters of `[a-z0-9-]`, starting\
          \ and ending with a letter or digit. Anything else is 404 `LINK_NAO_ENCONTRADO`."
        required: true
        schema:
          type: string
          pattern: "^[a-z0-9](?:[a-z0-9-]{0,62}[a-z0-9])?$"
      responses:
        "200":
          description: The link's info.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkInfoResponse"
        "400":
          description: "- `REQUISICAO_INVALIDA`: a path that isn't normalised."
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                REQUISICAO_INVALIDA:
                  value:
                    code: REQUISICAO_INVALIDA
                    message: Malformed request.
        "403":
          description: "- `BFF_KEY_AUSENTE`: `X-Kybr-BFF-Key` is missing or wrong\
            \ (the same body either way)."
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                BFF_KEY_AUSENTE:
                  value:
                    code: BFF_KEY_AUSENTE
                    message: Forbidden.
        "404":
          description: "- `LINK_NAO_ENCONTRADO`: the slug is unknown or malformed,\
            \ the link isn't set up yet, or it is disabled. Decided from the slug\
            \ alone, before anything else in the request is read."
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                LINK_NAO_ENCONTRADO:
                  value:
                    code: LINK_NAO_ENCONTRADO
                    message: Link not found.
        "406":
          description: "- `FORMATO_NAO_ACEITO`: `Accept` excludes `application/json`\
            \ (the body is still the JSON envelope)."
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                FORMATO_NAO_ACEITO:
                  value:
                    code: FORMATO_NAO_ACEITO
                    message: Response format not acceptable.
        "500":
          description: "- `ERRO_INTERNO`: an unexpected error. No detail is given."
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                ERRO_INTERNO:
                  value:
                    code: ERRO_INTERNO
                    message: Internal error.
        "503":
          description: "- `INDISPONIVEL`: the database is unavailable. Retry later."
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                INDISPONIVEL:
                  value:
                    code: INDISPONIVEL
                    message: Service unavailable.
        default:
          description: Error envelope
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /public/v/{slug}/lookup:
    get:
      tags:
      - Seller link
      summary: Look up a company
      description: "Fills in the company for the seller to confirm: its name (any\
        \ CPF masked), town, state and main activity. Answered from a local cache\
        \ first. Checks run in this order: slug, autofill switches, CNPJ, client limits,\
        \ then the lookup. A failed lookup never blocks starting the verification."
      operationId: lookup
      parameters:
      - $ref: "#/components/parameters/X-Kybr-BFF-Key"
      - $ref: "#/components/parameters/X-Kybr-Client-IP"
      - name: slug
        in: path
        description: "The link's slug: 1 to 64 characters of `[a-z0-9-]`, starting\
          \ and ending with a letter or digit. Anything else is 404 `LINK_NAO_ENCONTRADO`."
        required: true
        schema:
          type: string
          pattern: "^[a-z0-9](?:[a-z0-9-]{0,62}[a-z0-9])?$"
      - name: cnpj
        in: query
        description: "The company's CNPJ, canonical: 14 upper-case characters, no\
          \ punctuation, valid check digits; numeric or alphanumeric. The only query\
          \ parameter."
        required: true
        schema:
          type: string
          example: 12ABC34501DE35
          pattern: "^[0-9A-Z]{12}[0-9]{2}$"
      responses:
        "200":
          description: The company.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LookupResponse"
        "400":
          description: |-
            - `CNPJ_INVALIDO` (`field: cnpj`): missing, repeated, not canonical (lower case, punctuation), 14 identical characters, or a wrong check digit. 400 here, where the CNPJ is a query parameter; 422 on verify.
            - `REQUISICAO_INVALIDA`: a path that isn't normalised.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                CNPJ_INVALIDO:
                  value:
                    code: CNPJ_INVALIDO
                    message: Invalid CNPJ.
                REQUISICAO_INVALIDA:
                  value:
                    code: REQUISICAO_INVALIDA
                    message: Malformed request.
        "403":
          description: "- `BFF_KEY_AUSENTE`: `X-Kybr-BFF-Key` is missing or wrong\
            \ (the same body either way)."
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                BFF_KEY_AUSENTE:
                  value:
                    code: BFF_KEY_AUSENTE
                    message: Forbidden.
        "404":
          description: |-
            - `LINK_NAO_ENCONTRADO`: the slug is unknown or malformed, the link isn't set up yet, or it is disabled. Decided from the slug alone, before anything else in the request is read.
            - `EMPRESA_NAO_ENCONTRADA`: a valid CNPJ with no company data.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                LINK_NAO_ENCONTRADO:
                  value:
                    code: LINK_NAO_ENCONTRADO
                    message: Link not found.
                EMPRESA_NAO_ENCONTRADA:
                  value:
                    code: EMPRESA_NAO_ENCONTRADA
                    message: Company not found.
        "406":
          description: "- `FORMATO_NAO_ACEITO`: `Accept` excludes `application/json`\
            \ (the body is still the JSON envelope)."
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                FORMATO_NAO_ACEITO:
                  value:
                    code: FORMATO_NAO_ACEITO
                    message: Response format not acceptable.
        "429":
          description: "- `LIMITE_CONSULTAS`: too many lookups from this client (per\
            \ minute or per day)."
          headers:
            Retry-After:
              description: Seconds to wait before retrying (digits only).
              schema:
                type: integer
                format: int32
                minimum: 1
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                LIMITE_CONSULTAS:
                  value:
                    code: LIMITE_CONSULTAS
                    message: Too many lookups.
        "500":
          description: "- `ERRO_INTERNO`: an unexpected error. No detail is given."
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                ERRO_INTERNO:
                  value:
                    code: ERRO_INTERNO
                    message: Internal error.
        "503":
          description: |-
            - `AUTOFILL_DESATIVADO`: lookups are switched off (for this link or for every link), or the company isn't cached and this link may only read the cache right now. Checked before the CNPJ.
            - `INDISPONIVEL`: the data source failed, timed out or returned an incomplete record, or the database is unavailable.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                AUTOFILL_DESATIVADO:
                  value:
                    code: AUTOFILL_DESATIVADO
                    message: Autofill unavailable.
                INDISPONIVEL:
                  value:
                    code: INDISPONIVEL
                    message: Service unavailable.
        default:
          description: Error envelope
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /public/v/{slug}/cases/{token}:
    get:
      tags:
      - Seller link
      summary: Read a case
      description: The case's state and its seller-facing result. Polled while the
        verification runs. Readable even when the link has been disabled.
      operationId: readCase
      parameters:
      - $ref: "#/components/parameters/X-Kybr-BFF-Key"
      - $ref: "#/components/parameters/X-Kybr-Client-IP"
      - name: slug
        in: path
        description: "The link's slug: 1 to 64 characters of `[a-z0-9-]`, starting\
          \ and ending with a letter or digit. Anything else is 404 `LINK_NAO_ENCONTRADO`."
        required: true
        schema:
          type: string
          pattern: "^[a-z0-9](?:[a-z0-9-]{0,62}[a-z0-9])?$"
      - name: token
        in: path
        description: "The case token returned when the verification started. Anything\
          \ that doesn't match `^[A-Za-z0-9_-]{22,64}$` is 404 `CASO_NAO_ENCONTRADO`."
        required: true
        schema:
          type: string
          pattern: "^[A-Za-z0-9_-]{22,64}$"
      responses:
        "200":
          description: The case.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseResponse"
        "400":
          description: "- `REQUISICAO_INVALIDA`: a path that isn't normalised."
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                REQUISICAO_INVALIDA:
                  value:
                    code: REQUISICAO_INVALIDA
                    message: Malformed request.
        "403":
          description: "- `BFF_KEY_AUSENTE`: `X-Kybr-BFF-Key` is missing or wrong\
            \ (the same body either way)."
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                BFF_KEY_AUSENTE:
                  value:
                    code: BFF_KEY_AUSENTE
                    message: Forbidden.
        "404":
          description: |-
            - `LINK_NAO_ENCONTRADO`: the slug is unknown or malformed, or the link isn't set up yet. Decided from the slug alone, before the token is read; a disabled link still serves its existing cases.
            - `CASO_NAO_ENCONTRADO`: the token is unknown or belongs to another link (the same response either way).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                LINK_NAO_ENCONTRADO:
                  value:
                    code: LINK_NAO_ENCONTRADO
                    message: Link not found.
                CASO_NAO_ENCONTRADO:
                  value:
                    code: CASO_NAO_ENCONTRADO
                    message: Case not found.
        "406":
          description: "- `FORMATO_NAO_ACEITO`: `Accept` excludes `application/json`\
            \ (the body is still the JSON envelope)."
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                FORMATO_NAO_ACEITO:
                  value:
                    code: FORMATO_NAO_ACEITO
                    message: Response format not acceptable.
        "429":
          description: "- `LIMITE_TENTATIVAS`: too many reads from this client. Checked\
            \ before the token is read."
          headers:
            Retry-After:
              description: Seconds to wait before retrying (digits only).
              schema:
                type: integer
                format: int32
                minimum: 1
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                LIMITE_TENTATIVAS:
                  value:
                    code: LIMITE_TENTATIVAS
                    message: Too many attempts.
        "500":
          description: "- `ERRO_INTERNO`: an unexpected error. No detail is given."
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                ERRO_INTERNO:
                  value:
                    code: ERRO_INTERNO
                    message: Internal error.
        "503":
          description: "- `INDISPONIVEL`: the database is unavailable. Retry later."
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                INDISPONIVEL:
                  value:
                    code: INDISPONIVEL
                    message: Service unavailable.
        default:
          description: Error envelope
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    ContactRequest:
      properties:
        email:
          type: string
          description: "The seller's contact e-mail for this case: at most 254 characters,\
            \ no control or format characters, one `@`, a dotted domain. Surrounding\
            \ spaces are trimmed. Not confirmed."
          example: joao@empresa.com.br
          maxLength: 254
      required:
      - email
    VerifyRequest:
      properties:
        cnpj:
          type: string
          description: "The company's CNPJ, canonical: 14 upper-case characters, no\
            \ punctuation, valid check digits. Alphanumeric CNPJs are accepted."
          example: 12ABC34501DE35
          pattern: "^[0-9A-Z]{12}[0-9]{2}$"
        responsavel:
          type: string
          description: "The person responsible for the company, as the seller typed\
            \ it: at least two words, at most 120 characters after NFC normalisation,\
            \ letters, space, `'`, `-` and `.` only. Stored NFC-normalised and trimmed."
          example: Maria Exemplo
          maxLength: 120
        ref:
          type: string
          description: "The integrator's reference, optional: printable ASCII, at\
            \ most 256 characters. Stored untouched and never echoed."
          maxLength: 256
        ext_id:
          type: string
          description: "The integrator's external id, optional: printable ASCII, at\
            \ most 256 characters. It is not verified: anyone can edit the link's\
            \ query string. Stored untouched, shown as unverified and never echoed.\
            \ Match a case on the CNPJ plus your own record, never on `ext_id` alone."
          maxLength: 256
      required:
      - cnpj
      - responsavel
    VerifyResponse:
      properties:
        token:
          type: string
          description: Opaque; the seller's only way to read the case. Keep it secret.
          pattern: "^[A-Za-z0-9_-]{22,64}$"
      required:
      - token
    UploadForm:
      description: One `tipo` and one or more `arquivos` (the field repeated once
        per file).
      properties:
        tipo:
          type: string
          enum:
          - CONTRATO_SOCIAL_OU_CCMEI
          - PROCURACAO
          - COMPROVANTE_ENDERECO
          - CARTAO_CNPJ
          - RESPONSAVEL
        arquivos:
          type: array
          description: "One PDF, or one or more JPEG or PNG photos. Typed by their\
            \ first bytes; the file name and the part's content type are ignored."
          items:
            type: string
            format: binary
          maxItems: 30
          minItems: 1
      required:
      - arquivos
      - tipo
    UploadResponse:
      properties:
        tipo:
          type: string
          enum:
          - CONTRATO_SOCIAL_OU_CCMEI
          - PROCURACAO
          - COMPROVANTE_ENDERECO
          - CARTAO_CNPJ
          - RESPONSAVEL
        documentos_enviados:
          type: integer
          format: int32
          description: "The type's files accepted or still being checked, across calls;\
            \ a retried file isn't counted twice, and refused files aren't counted."
          minimum: 0
        situacao_envio:
          type: string
          description: "`verificando` once new files were received: they are checked\
            \ in the background, and the case read (D4) shows the outcome. A retry\
            \ that adds nothing answers the type's current state."
          enum:
          - verificando
          - aceito
          - recusado
      required:
      - documentos_enviados
      - situacao_envio
      - tipo
    ContatoVendedor:
      description: How the seller reaches the workspace.
      properties:
        tipo:
          type: string
          enum:
          - email
          - url
        valor:
          type: string
          description: "With `email`, a plain address (`[A-Za-z0-9._+-]` local part,\
            \ a dotted domain, at most 254 characters) that can safely become a `mailto:`;\
            \ with `url`, an absolute `https:` URL without userinfo."
          maxLength: 254
      required:
      - tipo
      - valor
    LinkInfoResponse:
      properties:
        nome:
          type: string
          description: "The workspace's name, shown as text."
          minLength: 1
        contato_vendedor:
          $ref: "#/components/schemas/ContatoVendedor"
      required:
      - contato_vendedor
      - nome
    Cnae:
      description: "The company's main activity: the description only, never the code."
      properties:
        descricao:
          type: string
          description: The main activity's description.
          example: Comercio varejista de artigos do vestuario
          minLength: 1
      required:
      - descricao
    LookupResponse:
      properties:
        razao_social:
          type: string
          description: "The company name, any CPF masked as `***.***.***-**`."
          example: LOJA EXEMPLO COMERCIO LTDA
          minLength: 1
        municipio:
          type: string
          description: The town of the company's address.
          example: Sao Paulo
          minLength: 1
        uf:
          type: string
          description: The state.
          example: SP
          pattern: "^[A-Z]{2}$"
        cnae:
          $ref: "#/components/schemas/Cnae"
      required:
      - cnae
      - municipio
      - razao_social
      - uf
    CaseResponse:
      description: A case's state and its seller-facing result. `resultado` is present
        unless `estado` is `processing`; on `processing` it appears only once a contact
        e-mail was saved (with `responsavel` and `email_contato_mascarado`) or when
        no company data was found.
      properties:
        estado:
          type: string
          description: "`processing` while the verification runs; then `pending` (something\
            \ is needed from the seller or a review is under way), `approved` or `blocked`."
          enum:
          - processing
          - pending
          - approved
          - blocked
        criado_em:
          type: string
          format: date-time
          description: "When the case was created, ISO 8601 with an offset."
          example: 2026-11-07T14:03:11Z
        resultado:
          $ref: "#/components/schemas/ResultadoPublico"
      required:
      - criado_em
      - estado
    Confirmacao:
      description: What was confirmed on an approved case. The rows and their order
        vary.
      properties:
        codigo:
          type: string
          enum:
          - SITUACAO_ATIVA
          - IE_ATIVA
          - RESPONSAVEL_CONFERE
        uf:
          type: string
          description: The state of the active registration; present with `IE_ATIVA`.
          pattern: "^[A-Z]{2}$"
      required:
      - codigo
    Item:
      description: What is needed or under review on a pending case.
      properties:
        codigo:
          type: string
          enum:
          - DOCUMENTO_RESPONSAVEL
          - DOCUMENTO_SOLICITADO
          - IE_NAO_ENCONTRADA
          - IE_SUSPENSA
          - SITUACAO_IRREGULAR
          - ATIVIDADE_FORA_DA_CATEGORIA
          - EMPRESA_RECENTE
          - MEI
        documento_tipo:
          type: string
          description: Present on document items.
          enum:
          - CONTRATO_SOCIAL_OU_CCMEI
          - PROCURACAO
          - COMPROVANTE_ENDERECO
          - CARTAO_CNPJ
          - RESPONSAVEL
        documentos_enviados:
          type: integer
          format: int32
          description: "Present on document items: the type's files accepted or still\
            \ being checked (refused files aren't counted)."
          minimum: 0
        formato_envio:
          type: string
          description: "On document items, once a file that still counts was sent\
            \ for the type: how the type is being sent. `pdf` takes no more files;\
            \ `fotos` takes more pages."
          enum:
          - pdf
          - fotos
        situacao_envio:
          type: string
          description: "On document items, once a file was sent for the type: `verificando`\
            \ while any of its files is being checked (poll this read until it changes),\
            \ then `recusado` when its latest upload had a refused file, otherwise\
            \ `aceito`."
          enum:
          - verificando
          - aceito
          - recusado
        documentos_recusados:
          type: integer
          format: int32
          description: "On document items, once a file was sent for the type: how\
            \ many of its files were refused so far, across uploads (it stays after\
            \ a later accepted upload)."
          minimum: 0
        motivo_recusa:
          type: string
          description: "With `situacao_envio=recusado`, about the latest upload: `CONTEUDO_NAO_PERMITIDO`\
            \ (the file isn't accepted; send a different one), `ARQUIVO_INVALIDO`\
            \ (it is damaged or unreadable; send a new copy or photo) or `VERIFICACAO_FALHOU`\
            \ (it couldn't be checked; send it again)."
          enum:
          - CONTEUDO_NAO_PERMITIDO
          - ARQUIVO_INVALIDO
          - VERIFICACAO_FALHOU
        situacao:
          type: string
          description: Present on `SITUACAO_IRREGULAR`.
          enum:
          - inapta
          - suspensa
          - baixada
          - nula
        dias:
          type: integer
          format: int32
          description: "Present on `EMPRESA_RECENTE`: days since the company opened."
          minimum: 1
        url_regularizacao:
          type: string
          description: An absolute `https:` URL on gov.br or a gov.br subdomain.
      required:
      - codigo
    Motivo:
      description: Why a case was blocked. A decision made by a person shows as `GENERICO`.
      properties:
        codigo:
          type: string
          enum:
          - SITUACAO_IRREGULAR
          - RESPONSAVEL_NAO_SOCIO
          - EMPRESA_RECENTE
          - ATIVIDADE_FORA_DA_CATEGORIA
          - IE_NAO_ENCONTRADA
          - IE_SUSPENSA
          - MEI
          - GENERICO
        situacao:
          type: string
          description: Present on `SITUACAO_IRREGULAR`.
          enum:
          - inapta
          - suspensa
          - baixada
          - nula
        url_regularizacao:
          type: string
          description: An absolute `https:` URL on gov.br or a gov.br subdomain.
      required:
      - codigo
    ResultadoPublico:
      description: "The seller-facing result: `confirmacoes` on `approved`, `itens`\
        \ on `pending`, `motivo` on `blocked`. Never raw checks, partner names, policy\
        \ names or verdict words."
      properties:
        razao_social:
          type: string
          description: "The company name, any CPF masked as `***.***.***-**`. Absent\
            \ with `variante`."
        responsavel:
          type: string
          description: "The responsible person as the seller typed it, NFC-normalised\
            \ and trimmed."
        consultado_em:
          type: string
          format: date-time
          description: "When the company data was fetched, ISO 8601 with an offset.\
            \ Present whenever there is company data; absent with `variante`, or on\
            \ `processing` before a result."
          example: 2026-11-07T14:03:11Z
        variante:
          type: string
          description: '`DADOS_NAO_ENCONTRADOS` when no company data was found; the
            case then goes to human review and keeps the variant after it is decided.'
          enum:
          - DADOS_NAO_ENCONTRADOS
        prazo_revisao:
          type: string
          format: date-time
          description: "When a pending case is due to be decided, ISO 8601 with an\
            \ offset. Always present on `pending`."
          example: 2026-11-09T14:03:11Z
        email_contato_mascarado:
          type: string
          description: "The seller's contact e-mail, masked, once saved: the first\
            \ character of the local part, then `•••` (a one-character local part\
            \ becomes just `•••`)."
          example: j•••@empresa.com.br
        confirmacoes:
          type: array
          items:
            $ref: "#/components/schemas/Confirmacao"
        itens:
          type: array
          items:
            $ref: "#/components/schemas/Item"
        motivo:
          $ref: "#/components/schemas/Motivo"
      required:
      - responsavel
    ErrorResponse:
      type: object
      description: The error envelope. `message` is fixed per code; clients branch
        on `code`.
      properties:
        code:
          type: string
          description: The error code.
          enum:
          - LINK_NAO_ENCONTRADO
          - EMPRESA_NAO_ENCONTRADA
          - CNPJ_INVALIDO
          - RESPONSAVEL_INVALIDO
          - LIMITE_CONSULTAS
          - LIMITE_CNPJ
          - LIMITE_TENTATIVAS
          - CASO_NAO_ENCONTRADO
          - EMAIL_INVALIDO
          - ARQUIVO_GRANDE
          - FORMATO_INVALIDO
          - CASO_DECIDIDO
          - LIMITE_ARQUIVOS
          - AUTOFILL_DESATIVADO
          - SESSAO_EXPIRADA
          - TURNSTILE_REQUERIDO
          - TURNSTILE_INVALIDO
          - TESTE_INDISPONIVEL
          - TESTE_PAUSADO
          - CREDENCIAIS_INVALIDAS
          - EMAIL_NAO_CONFIRMADO
          - EMAIL_EM_USO
          - SENHA_FRACA
          - VALOR_INVALIDO
          - CODIGO_INCORRETO
          - CODIGO_EXPIRADO
          - TOKEN_INVALIDO
          - RECURSO_NAO_ENCONTRADO
          - LOTE_NAO_ENCONTRADO
          - SEM_SALDO
          - MUITAS_LINHAS
          - SEM_CNPJ_VALIDO
          - LOTE_EM_ANDAMENTO
          - CASO_JA_DECIDIDO
          - MOTIVO_OBRIGATORIO
          - DOCUMENTO_NAO_HABILITADO
          - SENHA_ATUAL_INCORRETA
          - REVERIFICACAO_EM_ANDAMENTO
          - POLITICA_DESATUALIZADA
          - SEM_DOCUMENTO_HABILITADO
          - BFF_KEY_AUSENTE
          - ERRO_INTERNO
          - INDISPONIVEL
          - REQUISICAO_INVALIDA
          - METODO_NAO_PERMITIDO
          - FORMATO_NAO_ACEITO
          - MIDIA_NAO_SUPORTADA
          - REQUISICAO_GRANDE
        message:
          type: string
          description: "A fixed, generic message for the code."
        field:
          type: string
          description: "The offending field or header, when known."
      required:
      - code
      - message
  parameters:
    X-Kybr-BFF-Key:
      name: X-Kybr-BFF-Key
      in: header
      description: The server-to-server key of the link's frontend. Required on every
        call; it grants trust in `X-Kybr-Client-IP` and nothing else. Never logged.
      required: true
      schema:
        type: string
    X-Kybr-Client-IP:
      name: X-Kybr-Client-IP
      in: header
      description: "The end user's IP address (IPv4 or IPv6, no port), trusted only\
        \ with a valid `X-Kybr-BFF-Key`. Omit it when it can't be derived; never send\
        \ an empty or guessed value. Without it, limits are counted per link."
      required: false
      schema:
        type: string
  headers:
    X-Request-Id:
      description: "A fresh UUID v4 for this request, for support and log correlation."
      schema:
        type: string
        format: uuid
