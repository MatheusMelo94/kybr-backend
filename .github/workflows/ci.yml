# CI: every push and PR. Required to pass before merge (enable branch protection on main).
# Jobs: secret scan (gitleaks, full history) | build + test (JDK 25, ./mvnw verify with Docker for
# Testcontainers, OpenAPI drift gate, env parity) | container smoke (Dockerfile + docker-compose).
name: CI

on:
  # main on push; every other branch runs through its pull request (one run per commit).
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks

      - name: Prove the project rules catch Kybr's secret formats
        run: scripts/ci/check-gitleaks-rules.sh "$RUNNER_TEMP/gitleaks"

      - name: Scan full git history
        run: |
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --no-banner \
            --report-format sarif --report-path "$RUNNER_TEMP/gitleaks.sarif" --exit-code 1 .

      - name: Upload gitleaks report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitleaks-report
          path: ${{ runner.temp }}/gitleaks.sarif
          retention-days: 7

  build:
    name: Build and test (JDK 25, Testcontainers)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Public text (no references to private documents)
        run: scripts/ci/check-public-text.sh

      - name: Docker available for Testcontainers
        run: docker version --format 'Docker server {{.Server.Version}}'

      - name: Build and verify (unit + integration, incl. OpenApiDrift)
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp verify

      - name: OpenAPI drift gate
        run: scripts/ci/check-openapi-drift.sh

      - name: .env.example parity
        run: scripts/ci/check-env-example.sh

      - name: Upload OpenAPI contract
        if: hashFiles('docs/openapi.yaml') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openapi
          path: docs/openapi.yaml
          retention-days: 30

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          retention-days: 7

  container:
    name: Container build and compose smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Generate throwaway secrets into .env (the app has no secret defaults)
        run: ./run-local.sh --secrets

      - name: Validate compose file
        run: docker compose config --quiet

      - name: Build image and start the stack (mongo rs0 + app, profile docker)
        run: docker compose up -d --build --wait --wait-timeout 180

      - name: Probe liveness (8080) and readiness (8081)
        run: |
          curl -fsS http://127.0.0.1:8080/livez
          echo
          curl -fsS http://127.0.0.1:8081/actuator/health/readiness
          echo
          test "$(docker compose exec -T app id -u)" = "10001"

      - name: Container logs
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Tear down
        if: always()
        run: docker compose down -v

  alerting:
    name: Alert rules (promtool unit tests, Alertmanager config)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PROMETHEUS_VERSION: "3.15.1"
      PROMETHEUS_SHA256: "6a726885328ad9efebbf36e876ce2fb6225468a71fd1e7ce3ba666d5f4d97a84"
      ALERTMANAGER_VERSION: "0.34.1"
      ALERTMANAGER_SHA256: "265b9d1e55ef0d5306a436018af6d2b686c2ce051f03d968f7464ecb1372a7e8"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install promtool and amtool (pinned, checksum-verified)
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o prom.tgz "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz"
          echo "${PROMETHEUS_SHA256}  prom.tgz" | sha256sum -c -
          curl -sSfL -o am.tgz "https://github.com/prometheus/alertmanager/releases/download/v${ALERTMANAGER_VERSION}/alertmanager-${ALERTMANAGER_VERSION}.linux-amd64.tar.gz"
          echo "${ALERTMANAGER_SHA256}  am.tgz" | sha256sum -c -
          tar -xzf prom.tgz --strip-components=1 "prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool"
          tar -xzf am.tgz --strip-components=1 "alertmanager-${ALERTMANAGER_VERSION}.linux-amd64/amtool"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Check alert rules and routing
        run: scripts/ci/check-alerting.sh
