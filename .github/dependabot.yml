# Dependabot version updates, so dependency fixes arrive as PRs. Security updates/alerts are enabled in repo settings.
version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    groups:
      spring:
        patterns: ["org.springframework*", "org.springdoc*", "io.micrometer*"]
      test:
        patterns: ["org.testcontainers*", "org.junit*", "io.rest-assured*", "com.tngtech.archunit*", "org.mockito*", "org.assertj*"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: docker
    directories: ["/", "/deploy/log-shipper", "/deploy/alerting"]
    schedule:
      interval: weekly
      day: monday
      timezone: America/Sao_Paulo
    commit-message:
      prefix: "chore(docker)"

  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      timezone: America/Sao_Paulo
    commit-message:
      prefix: "chore(docker)"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      timezone: America/Sao_Paulo
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"
