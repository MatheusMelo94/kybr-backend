# clamd for the isolated scanner. Fail closed: anything that can't be fully scanned is FOUND, never OK.
# On the scanner machine the entrypoint drops TCPSocket and pins a Unix socket readable only by clamd's
# and stunnel's users; TCPSocket here serves the opt-in real-ClamAV test.
Foreground yes
# No LogFile: ClamAV opens log files with O_NOFOLLOW, and /dev/stdout is a symlink (ELOOP). In the
# foreground every message is also written to the console, which is the container's log.
LogTime yes
LogClean no
LogVerbose no
ExtendedDetectionInfo yes
PidFile /tmp/clamd.pid
DatabaseDirectory /var/lib/clamav
TCPSocket 3310

# Limits sized to the API's 10 MiB upload cap (plus margin); exceeding one raises an alert, not OK.
StreamMaxLength 12M
MaxFileSize 12M
MaxScanSize 50M
MaxThreads 4
MaxQueue 50
ReadTimeout 30
CommandReadTimeout 10
IdleTimeout 30
SelfCheck 600
# One database copy in memory during reloads (the machine holds clamd and the sanitizer).
ConcurrentDatabaseReload no

# Fail closed.
AlertExceedsMax yes
AlertEncrypted yes
AlertEncryptedDoc yes
AlertEncryptedArchive yes
AlertBrokenMedia yes
AlertBrokenExecutables yes

# What the service scans: PDFs (and anything embedded in them), images, archives, executables.
ScanPDF yes
ScanArchive yes
ScanPE yes
ScanELF yes
ScanOLE2 yes
Bytecode yes

# Parsers the service never needs: off, to shrink clamd's own attack surface.
ScanMail no
ScanHTML no
ScanHWP3 no
ScanSWF no
ScanXMLDOCS no
ScanOneNote no
PhishingSignatures no
PhishingScanURLs no
