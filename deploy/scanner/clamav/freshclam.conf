# freshclam for the isolated scanner: official databases every 2 h; clamd is told to reload.
# The API refuses uploads when signatures are older than 48 h (and alerts at 26 h).
DatabaseDirectory /var/lib/clamav
UpdateLogFile /dev/stdout
LogTime yes
Foreground yes
DatabaseMirror database.clamav.net
Checks 12
ConnectTimeout 30
ReceiveTimeout 60
NotifyClamd /run/kybr/clamd.conf
