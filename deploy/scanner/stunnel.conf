# stunnel: the scanner app's only network surface. Mutual TLS 1.3, client certificates verified against
# the link's private CA (used for nothing else) and restricted to the API identities below.
# Fly forwards public ports 3310 / 3311 (raw TCP, dedicated IPv6) to 13310 / 13311 here.
foreground = yes
pid =
syslog = no
debug = notice
socket = l:TCP_NODELAY=1

; Shared TLS policy (inherited by every service below).
cert = /run/kybr/tls/server.crt
key = /run/kybr/tls/server.key
CAfile = /run/kybr/tls/ca.crt
verifyChain = yes
requireCert = yes
sslVersionMin = TLSv1.3
sslVersionMax = TLSv1.3
; Only the API's client certificates (SAN DNS names issued by the link CA).
checkHost = kybr-api.scan-link.internal
checkHost = kybr-api-staging.scan-link.internal
; Idle and slow peers can't hold the ports: 10 s to finish the handshake / send data, 5 s to reach the
; local service, 60 s idle between a finished request and close.
TIMEOUTbusy = 10
TIMEOUTconnect = 5
TIMEOUTidle = 60
TIMEOUTclose = 0

[clamd]
accept = 0.0.0.0:13310
; clamd's Unix socket (group scanlink); the photo sanitizer's user cannot open it.
connect = /run/clamd/clamd.sock

[sanitizer]
accept = 0.0.0.0:13311
connect = 127.0.0.1:8090
